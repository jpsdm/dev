name: Bug report
description: Something in dev doesn't work as described
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! Please search the existing issues first.
        Run the failing command again with `--verbose` and paste the output below.
  - type: input
    id: version
    attributes:
      label: dev version
      description: Output of `dev version`
      placeholder: 2026.11.3 windows-x86_64 (2026-11-06)
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: System
      options: [Windows, Linux, macOS]
    validations:
      required: true
  - type: dropdown
    id: shell
    attributes:
      label: Terminal / shell
      options: [PowerShell 7, Windows PowerShell 5.1, cmd.exe, Git Bash, bash, zsh, fish, other]
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: What you ran
      description: The exact command(s), e.g. `dev use java 21`
      render: shell
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened (output with --verbose)
      render: text
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Output of `dev doctor`
      render: text
  - type: textarea
    id: config
    attributes:
      label: Your dev.toml (if it matters)
      description: Remove tokens and other secrets first.
      render: toml
