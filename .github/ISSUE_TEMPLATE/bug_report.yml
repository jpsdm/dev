name: Bug report
description: Something isn't working the way it should
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please search
        [existing issues](https://github.com/jpsdm/dev/issues) first to
        avoid duplicates.

        Found a security vulnerability instead? Please see
        [SECURITY.md](https://github.com/jpsdm/dev/blob/main/SECURITY.md)
        rather than filing it here.

  - type: input
    id: version
    attributes:
      label: dev version
      description: Output of `dev version`
      placeholder: "v0.4.0"
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Linux
        - macOS
        - Windows
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: The exact `dev` commands you ran, in order.
      render: shell
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant output
      description: Full output of the failing command(s), unedited.
      render: shell

  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I confirmed the version I'm reporting against (`dev version`) — or deliberately reproduced this on an older release
        - label: I searched existing issues and didn't find a duplicate
