[package]
name = "dev"
version = "2026.11.3"
edition = "2021"
description = "dev: tool versions, environment, tasks and a workspace for your projects"
repository = "https://github.com/jpsdm/dev"
homepage = "https://github.com/jpsdm/dev"

[[bin]]
name = "dev"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
toml_edit = "0.22"
ignore = "0.4"
png = "0.17"
font8x8 = "0.3"
sha2 = "0.10"
sha1 = "0.10"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }

[profile.release]
opt-level = 3
